name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: check that tool updates still resolve against live PyPI, so an
    # upstream dependency change (like yt-dlp requiring a newer certifi) is
    # caught before users press "Update tools".
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install engine (CPU) and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt -r backend/requirements-engine.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Tests
        working-directory: backend
        env:
          CRATEDIGGER_LIVE_TESTS: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python -m pytest tests

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Typecheck (includes the API contract check) and build
        run: npm run build
        working-directory: frontend

  shell:
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Placeholder sidecar resource (the real one is built by scripts/build-sidecar.ps1)
        run: New-Item -ItemType Directory -Force -Path src-tauri/resources/crate-digger-api | Out-Null
      - run: cargo test
        working-directory: src-tauri
